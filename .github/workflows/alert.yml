name: alert-bot

on:
  schedule:
    # 15분마다 (GitHub 사정으로 몇 분씩 지연될 수 있음)
    # public 레포라 Actions 무료. private으로 돌리면 월 2,000분 한도를 넘으니 "*/30 * * * *"로
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal: 평소대로 / test: 최근 3건을 [테스트]로 전송(상태 변경 없음) / seed: 현재 항목을 본 것으로만 기록 / dry: 보낼 항목을 로그에만 출력"
        type: choice
        options: [normal, test, seed, dry]
        default: normal

permissions:
  contents: write

concurrency:
  group: alert-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 요약할 새 항목이 있을 때만 봇이 Claude Code CLI를 npm으로 설치함
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            test) python -m alertbot.main --test 3 ;;
            seed) python -m alertbot.main --seed ;;
            dry)  python -m alertbot.main --dry-run ;;
            *)    python -m alertbot.main ;;
          esac

      - name: Commit state
        if: always()
        run: |
          git config user.name "alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "chore: update alert state"  # [skip ci]를 넣으면 schedule 실행까지 막힘. 이 워크플로는 push로 실행되지 않아 필요 없음
          git pull --rebase --autostash -q && git push -q
